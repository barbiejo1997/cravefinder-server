# ============================================================
# WHAT IS THIS FILE?
# ============================================================
# application.properties configures how your Spring Boot
# server behaves. It's like settings in a phone app.
#
# Render.com sets the PORT environment variable automatically.
# We tell Spring Boot to use whatever port Render assigns.
# ============================================================

# Use the PORT environment variable provided by Render.com
# If not set (e.g. running locally), default to port 8080
server.port=${PORT:8080}

# App name — shows up in logs
spring.application.name=CraveFinder

# Log level — INFO means show normal messages, not debug spam
logging.level.root=INFO
logging.level.com.cravefinder=DEBUG
